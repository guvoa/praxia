<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Sovix" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sxTile" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B44E8"/>
      <stop offset=".55" stop-color="#4B34D9"/>
      <stop offset="1" stop-color="#2E1E96"/>
    </linearGradient>
    <linearGradient id="sxRing" x1="12" y1="10" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7CDFF"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="14" fill="url(#sxTile)"/>

  <!-- Three orbits around one centre: the mark is a group, not a letter. -->
  <g fill="none" stroke="url(#sxRing)" stroke-width="2.1" opacity=".95">
    <circle cx="24" cy="18.4" r="9.2"/>
    <circle cx="28.9" cy="26.8" r="9.2"/>
    <circle cx="19.1" cy="26.8" r="9.2"/>
  </g>

  <circle cx="24" cy="24" r="3.5" fill="#FFB020"/>
</svg>
